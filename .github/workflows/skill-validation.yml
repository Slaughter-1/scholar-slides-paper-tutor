name: Skill validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: scholar-slides/runtime/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r scholar-slides/runtime/requirements-runtime.txt
      - name: Install Node dependencies and Chromium
        working-directory: scholar-slides/runtime
        run: |
          npm ci
          npx playwright install chromium
      - name: Validate skill metadata
        run: python scripts/validate_skills.py scholar-slides paper-tutor
      - name: Run Scholar-Slides tests
        run: python -m unittest discover -s scholar-slides/tests -q
      - name: Run Paper Learning Map tests
        run: python -m unittest discover -s scholar-slides/paper-learning-map/tests -q
      - name: Run public release audit
        run: python scripts/audit_public_release.py --repo . --json
      - name: Run CLI doctor
        working-directory: scholar-slides/runtime
        run: python scripts/scholar_slides.py doctor --json
